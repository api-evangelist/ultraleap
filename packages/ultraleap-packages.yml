notes: >-
  Ultraleap does not sell a hosted API, so its client libraries are engine plugins and
  native/language bindings for the LeapC hand-tracking API rather than HTTP SDKs. Registry
  coverage is Unity UPM via OpenUPM plus GitHub source releases and zip downloads from
  the company's own S3 bucket. Probed 2026-09-18 and NOT found as first-party: npm
  (search "ultraleap" returns 0 packages; the TouchFreeWebTooling package.json names
  itself "touchfree" but registry.npmjs.org/touchfree is 404), PyPI (leapc-python-bindings,
  leapc-cffi, leapc-python-api, ultraleap, handybeam all 404), NuGet (only third-party
  vvvv and Silk.NET wrappers). The haptics SDK is supplied on request
  (docs.ultraleap.com/haptics: "Get in touch for our latest software releases") and is
  not listed because it is not published.
