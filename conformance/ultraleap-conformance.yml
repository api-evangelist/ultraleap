notes: >-
  LeapC is a native local-IPC API, so the web API standards (OAuth2, OIDC, RFC 9457, JSON:API,
  SCIM, OData, FHIR, PSD2) do not apply and are recorded conforms:false. The domain standard for
  Ultraleap's market is Khronos OpenXR: the company ships an implicit OpenXR API layer and its
  own docs enumerate the OpenXR extensions it serves, including two vendor extensions registered
  under the XR_ULTRALEAP_ prefix. This is read from the provider's own documentation of the
  contract it implements, not a marketing claim; no formal Khronos conformance-test result is
  published, so it is recorded as documented extension support rather than certified conformance.
  The compliance program the company publishes is quality/environmental (ISO 9001:2015 and
  ISO 14001:2015 certificates, hosted as images on the legal page) plus hardware regulatory
  marks; no SOC 2 / ISO 27001 / security certification is published.
