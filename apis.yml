apis:
- aid: ultraleap:leapc-tracking-api
  name: LeapC Tracking API
  description: >-
    LeapC is the native C API of the Ultraleap Hand Tracking Software. A client opens a
    connection to the locally running tracking service and polls it for tracking frames
    (hands, palms, digits, bones), device events, image frames, policy and configuration
    responses, plus the Hyperion V6 hinting, marker-tracking and direct-camera-access
    surfaces. It is the layer the Unity, Unreal, OpenXR and Python bindings are built on.
    There is no hosted HTTP base URL; the transport is local IPC to the tracking service.
  humanURL: https://docs.ultraleap.com/api-reference/tracking-api/index.html
  tags:
  - Hand Tracking
  - Native API
  - C
  properties:
  - type: Documentation
    url: https://docs.ultraleap.com/api-reference/tracking-api/leapc-guide.html
  - type: APIReference
    url: https://docs.ultraleap.com/api-reference/tracking-api/api-reference.html
  - type: Examples
    url: https://docs.ultraleap.com/api-reference/tracking-api/examples.html
  - type: ReleaseNotes
    url: https://docs.ultraleap.com/hand-tracking/Hyperion/index.html
- aid: ultraleap:openxr-api-layer
  name: Ultraleap OpenXR API Layer
  description: >-
    An implicit Khronos OpenXR API layer, installed with the Hand Tracking Software, that
    serves XR_EXT_hand_tracking, XR_EXT_hand_joints_motion_range,
    XR_EXT_hand_tracking_data_source, XR_MSFT_hand_interaction,
    XR_ULTRALEAP_hand_tracking_forearm, XR_ULTRALEAP_hand_tracking_hints and
    XR_FB_hand_tracking_aim to any OpenXR application without code changes.
  humanURL: https://docs.ultraleap.com/openxr/index.html
  tags:
  - OpenXR
  - Hand Tracking
  - XR
  properties:
  - type: Documentation
    url: https://docs.ultraleap.com/openxr/index.html
  - type: ChangeLog
    url: https://docs.ultraleap.com/openxr/changelog/index.html
  - type: SourceCode
    url: https://github.com/ultraleap/OpenXRHandTracking
- aid: ultraleap:tracking-websocket
  name: Ultraleap Tracking WebSocket
  description: >-
    An open-source WebSocket server from Ultraleap that restores the LeapJS-compatible
    surface removed when Leap Motion Orion V4 was replaced by Ultraleap Gemini V5. It streams
    tracking data over the legacy LeapJS v6 JSON protocol so browser applications can
    consume hand tracking. It runs locally alongside the tracking service; the endpoint is
    a loopback WebSocket, not a hosted API.
  humanURL: https://github.com/ultraleap/UltraleapTrackingWebSocket
  tags:
  - WebSocket
  - Streaming
  - Browser
  properties:
  - type: SourceCode
    url: https://github.com/ultraleap/UltraleapTrackingWebSocket
  - type: Documentation
    url: https://github.com/ultraleap/UltraleapTrackingWebSocket/blob/main/README.md
- aid: ultraleap:touchfree-tooling
  name: TouchFree Tooling
  description: >-
    TouchFree turns Ultraleap hand tracking into touchless cursor and gesture input for
    kiosks, digital signage and existing 2D user interfaces. The TouchFree Service runs
    locally and the Tooling for Web (TypeScript) and Tooling for Unity client libraries
    connect to it to receive input actions and drive UI components.
  humanURL: https://docs.ultraleap.com/TouchFree/touchfree-user-manual/index.html
  tags:
  - Touchless Interaction
  - Kiosk
  - Web
  - Unity
  properties:
  - type: Documentation
    url: https://docs.ultraleap.com/TouchFree/touchfree-user-manual/tooling-for-web.html
  - type: SourceCode
    url: https://github.com/ultraleap/TouchFreeWebTooling
  - type: Components
    url: components/ultraleap-components.yml
