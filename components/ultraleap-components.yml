  description: Touchless interaction layer that maps Ultraleap hand tracking to on-screen cursor and gesture input for kiosks, signage and existing UIs; the TouchFree Service runs locally and client tooling connects to it.
  docs: https://docs.ultraleap.com/TouchFree/touchfree-user-manual/index.html
  design_guidance: https://docs.ultraleap.com/TouchFree/touchless-interfaces/ui-components.html
  components:
