notes: >-
  Distinct from the native SDK bindings in packages/. Ultraleap ships client-side interaction
  component libraries — the TouchFree family, which turns hand tracking into touchless cursor
  and gesture input for kiosks and existing 2D UIs — plus the interaction/UI prefab sets inside
  the Unity plugin. TouchFree Tooling for Web is a TypeScript library (package name "touchfree"
  in its package.json, not published to npm) distributed as a zip from the downloads page and
  as source on GitHub.
component_families:
